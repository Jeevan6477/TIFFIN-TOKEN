<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Sri Tiffin Center</title>
  <meta name="theme-color" content="#991b1b" />

  <style>
    * { 
      box-sizing: border-box; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      margin: 0; 
      padding: 0; 
      -webkit-tap-highlight-color: transparent;
    }

    body { 
      background: #140303;
      color: #f3f4f6;
      padding: 12px; 
      padding-bottom: 150px; 
      min-height: 100vh;
    }

    header { 
      background: #991b1b;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 14px; 
      padding: 12px 16px; 
      margin-bottom: 10px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
    }
    header h1 { font-size: 1.25rem; font-weight: 800; color: #ffffff; }
    .token-badge { 
      background: #ffffff;
      color: #991b1b; 
      padding: 6px 14px; 
      border-radius: 20px; 
      font-weight: 900; 
      font-size: 0.95rem; 
    }

    .status-strip {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      font-size: 0.8rem;
      font-weight: 700;
      color: #e5e7eb;
      cursor: pointer;
    }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; }

    .nav-tabs { display: flex; gap: 8px; margin-bottom: 14px; }
    .nav-tabs button { 
      flex: 1; 
      padding: 10px 4px; 
      border-radius: 10px; 
      font-weight: 700; 
      font-size: 0.9rem; 
      cursor: pointer; 
      background: rgba(255, 255, 255, 0.08); 
      color: #d1d5db; 
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .nav-tabs button.active { 
      background: #dc2626;
      color: #ffffff; 
      border: 1px solid rgba(255, 255, 255, 0.35);
    }

    /* POS Item Grid */
    .menu-grid { 
      display: grid; 
      grid-template-columns: repeat(2, 1fr); 
      gap: 10px; 
    }
    .card { 
      background: rgba(255, 255, 255, 0.08);
      border-radius: 14px; 
      overflow: hidden; 
      border: 1px solid rgba(255, 255, 255, 0.15); 
      display: flex; 
      flex-direction: column; 
    }
    .card-img { 
      width: 100%; 
      height: 95px; 
      object-fit: cover; 
      background: #2b0b0b;
    }
    .card-body { 
      padding: 10px 6px; 
      text-align: center; 
    }
    .card h4 { font-size: 1.05rem; font-weight: 800; color: #ffffff; margin-bottom: 2px; }
    .card .price { color: #4ade80; font-weight: 800; font-size: 1.15rem; margin-bottom: 8px; }
    
    .controls { display: flex; justify-content: center; align-items: center; gap: 10px; }
    .btn-qty { 
      width: 40px; 
      height: 40px; 
      background: rgba(255, 255, 255, 0.25); 
      border: 1px solid rgba(255, 255, 255, 0.4); 
      border-radius: 8px; 
      color: #ffffff; 
      font-weight: 900; 
      font-size: 1.4rem; 
      cursor: pointer; 
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-qty:active { background: rgba(255, 255, 255, 0.5); transform: scale(0.92); }
    .qty-number { font-size: 1.25rem; font-weight: 900; min-width: 22px; color: #ffffff; }

    /* Fixed Checkout Footer */
    .checkout-panel { 
      position: fixed; 
      bottom: 0; left: 0; right: 0; 
      background: #0a0101;
      border-top: 1px solid rgba(255, 255, 255, 0.2); 
      padding: 10px 14px; 
      z-index: 50; 
    }
    .total-row { display: flex; justify-content: space-between; font-size: 1.25rem; font-weight: 800; margin-bottom: 8px; color: #ffffff; }
    .total-row span:last-child { color: #4ade80; }
    
    .actions { display: flex; gap: 8px; }
    .btn-pay { 
      flex: 1; 
      padding: 12px 2px; 
      border: none; 
      border-radius: 10px; 
      font-size: 0.9rem; 
      font-weight: 800; 
      color: white; 
      cursor: pointer; 
      text-align: center;
    }
    .btn-pay:active { transform: scale(0.96); }
    .btn-preview { background: #475569; }
    .btn-cash { background: #16a34a; }
    .btn-upi { background: #2563eb; }

    /* Manage Menu & Settings */
    .section-card { 
      background: rgba(255, 255, 255, 0.08); 
      border-radius: 14px; 
      padding: 16px; 
      border: 1px solid rgba(255, 255, 255, 0.15); 
      margin-bottom: 14px; 
    }
    .section-card h3 { font-size: 1.1rem; margin-bottom: 10px; color: #ffffff; }
    .form-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 8px; }
    .form-group label { font-size: 0.85rem; color: #d1d5db; font-weight: 600; }
    .form-group input { padding: 12px; border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 8px; font-size: 1rem; background: rgba(0,0,0,0.4); color: white; }
    .btn-action { background: #dc2626; color: white; border: none; padding: 12px; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; }
    .item-list-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
    .btn-delete { background: #fee2e2; color: #991b1b; border: none; padding: 8px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }

    /* Thermal Receipt Modal Preview */
    #token-modal { 
      display: none; 
      position: fixed; 
      inset: 0; 
      background: rgba(0,0,0,0.85); 
      align-items: center; 
      justify-content: center; 
      padding: 16px; 
      z-index: 999; 
    }
    .receipt-paper { 
      background: #fafafa; 
      color: #111827; 
      width: 100%; 
      max-width: 320px; 
      padding: 20px 16px; 
      border-radius: 4px; 
      font-family: "Courier New", Courier, monospace;
      font-size: 0.85rem;
      line-height: 1.35;
      position: relative;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
    }
    .receipt-paper::after {
      content: "";
      position: absolute;
      bottom: -10px;
      left: 0; right: 0;
      height: 10px;
      background: linear-gradient(135deg, transparent 5px, #fafafa 5px) 0 0,
                  linear-gradient(-135deg, transparent 5px, #fafafa 5px) 0 0;
      background-size: 10px 10px;
      background-repeat: repeat-x;
    }
    .receipt-center { text-align: center; }
    .receipt-bold { font-weight: 900; }
    .receipt-divider { border-top: 1px dashed #6b7280; margin: 8px 0; }
    .receipt-row { display: flex; justify-content: space-between; }
    .receipt-col-name { width: 44%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
    .receipt-col-qty { width: 30%; text-align: center; }
    .receipt-col-total { width: 26%; text-align: right; }

    /* Sales Register */
    .sales-summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
    .metric { background: rgba(255, 255, 255, 0.08); padding: 10px 4px; border-radius: 10px; text-align: center; }
    .metric span { display: block; font-size: 0.85rem; color: #9ca3af; margin-bottom: 2px; }
    .metric strong { font-size: 1.15rem; color: #ffffff; font-weight: 900; }
    .table-container { background: rgba(255, 255, 255, 0.06); border-radius: 12px; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th, td { padding: 8px; text-align: left; border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
    th { background: rgba(255, 255, 255, 0.1); font-weight: 700; color: #e5e7eb; }
    .btn-export { background: rgba(255,255,255,0.15); color: white; padding: 12px; border-radius: 10px; width: 100%; font-size: 0.95rem; font-weight: 800; margin-top: 12px; cursor: pointer; border: none; }
  </style>
</head>
<body>

  <header>
    <h1 id="display-shop-name">Sri Tiffin Center</h1>
    <div class="token-badge">Next: #<span id="next-token-id">1</span></div>
  </header>

  <div class="status-strip">
    <div class="status-pill" onclick="alert('POS stores all data safely in local storage.')">
      <span class="status-dot" style="background:#22c55e;"></span>
      <span>Storage: Active</span>
    </div>
    <div class="status-pill" onclick="connectPrinter()">
      <span class="status-dot" id="printer-dot" style="background:#9ca3af;"></span>
      <span id="printer-label">Printer: Connect</span>
    </div>
  </div>

  <div class="nav-tabs">
    <button id="tab-billing" class="active" onclick="switchView('billing')">Order POS</button>
    <button id="tab-sales" onclick="switchView('sales')">Daily Sales</button>
    <button id="tab-manage" onclick="switchView('manage')">Manage Menu</button>
  </div>

  <!-- 1. POS VIEW -->
  <div id="view-billing">
    <div class="menu-grid" id="menu-container"></div>
    <div class="checkout-panel">
      <div class="total-row">
        <span>Total:</span>
        <span>₹<span id="pos-total">0</span></span>
      </div>
      <div class="actions">
        <button class="btn-pay btn-preview" onclick="previewCurrentBill()">
          👁️ Preview Bill
        </button>
        <button class="btn-pay btn-cash" onclick="generateToken('Cash')">
          Cash Pay
        </button>
        <button class="btn-pay btn-upi" onclick="generateToken('UPI')">
          UPI Pay
        </button>
      </div>
    </div>
  </div>

  <!-- 2. SALES VIEW -->
  <div id="view-sales" style="display: none;">
    <div class="sales-summary">
      <div class="metric"><span>Tokens</span><strong id="stat-tokens">0</strong></div>
      <div class="metric"><span>UPI (₹)</span><strong id="stat-upi">0</strong></div>
      <div class="metric"><span>Total (₹)</span><strong id="stat-total">0</strong></div>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr><th>Token</th><th>Items</th><th>Pay</th><th>₹</th></tr>
        </thead>
        <tbody id="sales-rows"></tbody>
      </table>
    </div>

    <button class="btn-export" onclick="exportToCSV()">Download Sales (CSV)</button>
    <button class="btn-export" style="background: #b91c1c; margin-top:8px;" onclick="resetDay()">Reset Day Counter</button>
  </div>

  <!-- 3. MANAGE MENU & SHOP VIEW -->
  <div id="view-manage" style="display: none;">
    <div class="section-card">
      <h3>Shop & Print Details</h3>
      <div class="form-group">
        <label>Shop / Center Name:</label>
        <input type="text" id="input-shop-name" placeholder="Sri Tiffin Center" />
        
        <label>Address Line:</label>
        <input type="text" id="input-shop-address" placeholder="Main Road, Near Bus Stand" />
        
        <label>Mobile / Phone Number:</label>
        <input type="text" id="input-shop-phone" placeholder="9876543210" />
        
        <button class="btn-action" style="margin-top: 6px;" onclick="saveShopDetails()">Save Shop Details</button>
      </div>
    </div>

    <div class="section-card">
      <h3>Add New Menu Item</h3>
      <div class="form-group">
        <input type="text" id="new-item-name" placeholder="Item Name (e.g., Mysore Bonda)" />
        <input type="number" id="new-item-price" placeholder="Price (₹)" />
        <label>Item Image (Optional):</label>
        <input type="file" id="new-item-file" accept="image/*" />
        <button class="btn-action" style="margin-top: 4px;" onclick="addItem()">Add to Menu</button>
      </div>
    </div>

    <div class="section-card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <h3>Current Menu Items</h3>
        <button onclick="restoreDefaultItems()" style="font-size: 0.75rem; background: rgba(255,255,255,0.2); color:white; border:none; padding:6px 10px; border-radius:6px; cursor:pointer;">Reset Defaults</button>
      </div>
      <div id="manage-menu-list"></div>
    </div>
  </div>

  <!-- THERMAL RECEIPT MODAL PREVIEW -->
  <div id="token-modal" onclick="closeModal()">
    <div style="display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 320px;" onclick="event.stopPropagation()">
      <div class="receipt-paper" id="receipt-preview-content"></div>
      <div style="display: flex; gap: 8px; margin-top: 6px;">
        <button class="btn-pay btn-cash" style="padding: 12px;" onclick="reprintCurrentToken()">
          🖨️ Print Slip
        </button>
        <button class="btn-pay" style="background: rgba(255,255,255,0.2); padding: 12px;" onclick="closeModal()">
          Close
        </button>
      </div>
    </div>
  </div>

  <script>
    const DEFAULT_ITEMS = [
      { id: 1, name: "Idli (4)", price: 40, image: "https://images.unsplash.com/photo-1589301760014-d929f3979dbc?w=400&auto=format&fit=crop&q=80" },
      { id: 2, name: "Wada (2)", price: 45, image: "https://images.unsplash.com/photo-1626777552726-4a6b54c97e46?w=400&auto=format&fit=crop&q=80" },
      { id: 3, name: "Masala Dosa", price: 55, image: "https://images.unsplash.com/photo-1668236543090-82eba5ee5976?w=400&auto=format&fit=crop&q=80" },
      { id: 4, name: "Plain Dosa", price: 45, image: "https://images.unsplash.com/photo-1668236543090-82eba5ee5976?w=400&auto=format&fit=crop&q=80" },
      { id: 5, name: "Poori (2)", price: 50, image: "https://images.unsplash.com/photo-1601050690597-df0568f70950?w=400&auto=format&fit=crop&q=80" },
      { id: 6, name: "Filter Coffee", price: 20, image: "https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?w=400&auto=format&fit=crop&q=80" }
    ];

    let shopName = "Sri Tiffin Center";
    let shopAddress = "Main Road, Near Bus Stand";
    let shopPhone = "9876543210";
    let menu = DEFAULT_ITEMS;
    let localSales = [];
    let currentToken = 1;
    let cart = {};
    let printCharacteristic = null;
    let activeSlipRecord = null;
    let activeSlipItems = null;

    // Load persisted settings safely
    try {
      shopName = localStorage.getItem("shop_name") || "Sri Tiffin Center";
      shopAddress = localStorage.getItem("shop_address") || "Main Road, Near Bus Stand";
      shopPhone = localStorage.getItem("shop_phone") || "9876543210";
      
      const savedMenu = localStorage.getItem("shop_menu");
      if (savedMenu) menu = JSON.parse(savedMenu);
      
      const savedSales = localStorage.getItem("shop_sales");
      if (savedSales) localSales = JSON.parse(savedSales);
      
      currentToken = parseInt(localStorage.getItem("shop_token") || "1", 10);
    } catch (e) {
      console.warn("Storage reset:", e);
      menu = DEFAULT_ITEMS;
    }

    // Initialize UI
    function init() {
      document.getElementById("display-shop-name").innerText = shopName;
      document.getElementById("input-shop-name").value = shopName;
      document.getElementById("input-shop-address").value = shopAddress;
      document.getElementById("input-shop-phone").value = shopPhone;
      document.getElementById("next-token-id").innerText = currentToken;
      renderPOSGrid();
    }

    function renderPOSGrid() {
      const grid = document.getElementById("menu-container");
      grid.innerHTML = "";
      menu.forEach(item => {
        const div = document.createElement("div");
        div.className = "card";
        div.innerHTML = `
          <img class="card-img" src="${item.image || 'https://placehold.co/400x300?text=Tiffin'}" alt="${item.name}" onerror="this.src='https://placehold.co/400x300?text=Tiffin'" />
          <div class="card-body">
            <h4>${item.name}</h4>
            <div class="price">₹${item.price}</div>
            <div class="controls">
              <button class="btn-qty" type="button" onclick="changeQty(${item.id}, -1)">-</button>
              <span class="qty-number" id="qty-${item.id}">${cart[item.id] || 0}</span>
              <button class="btn-qty" type="button" onclick="changeQty(${item.id}, 1)">+</button>
            </div>
          </div>
        `;
        grid.appendChild(div);
      });
    }

    function changeQty(id, delta) {
      cart[id] = Math.max(0, (cart[id] || 0) + delta);
      const el = document.getElementById("qty-" + id);
      if (el) el.innerText = cart[id];
      
      let total = 0;
      for (let itemId in cart) {
        const item = menu.find(m => m.id == itemId);
        if (item) total += cart[itemId] * item.price;
      }
      document.getElementById("pos-total").innerText = total;
    }

    function saveShopDetails() {
      const nameVal = document.getElementById("input-shop-name").value.trim();
      const addrVal = document.getElementById("input-shop-address").value.trim();
      const phoneVal = document.getElementById("input-shop-phone").value.trim();

      if (!nameVal) return alert("Please enter shop name.");

      shopName = nameVal;
      shopAddress = addrVal;
      shopPhone = phoneVal;

      localStorage.setItem("shop_name", shopName);
      localStorage.setItem("shop_address", shopAddress);
      localStorage.setItem("shop_phone", shopPhone);

      document.getElementById("display-shop-name").innerText = shopName;
      alert("Shop details updated successfully!");
    }

    function addItem() {
      const name = document.getElementById("new-item-name").value.trim();
      const price = parseInt(document.getElementById("new-item-price").value, 10);
      const fileInput = document.getElementById("new-item-file");
      
      if (!name || isNaN(price) || price <= 0) return alert("Enter valid item name and price.");

      const save = (imgData) => {
        menu.push({ id: Date.now(), name, price, image: imgData || '' });
        localStorage.setItem("shop_menu", JSON.stringify(menu));
        document.getElementById("new-item-name").value = "";
        document.getElementById("new-item-price").value = "";
        fileInput.value = "";
        renderPOSGrid();
        renderManageMenu();
        alert("Item added to menu!");
      };

      if (fileInput.files && fileInput.files[0]) {
        const reader = new FileReader();
        reader.onload = e => save(e.target.result);
        reader.readAsDataURL(fileInput.files[0]);
      } else {
        save(null);
      }
    }

    function deleteItem(id) {
      menu = menu.filter(m => m.id !== id);
      delete cart[id];
      localStorage.setItem("shop_menu", JSON.stringify(menu));
      renderPOSGrid();
      renderManageMenu();
    }

    function restoreDefaultItems() {
      if (confirm("Reset menu to default items?")) {
        menu = DEFAULT_ITEMS;
        localStorage.setItem("shop_menu", JSON.stringify(menu));
        renderPOSGrid();
        renderManageMenu();
      }
    }

    function renderManageMenu() {
      const list = document.getElementById("manage-menu-list");
      list.innerHTML = menu.map(m => `
        <div class="item-list-row">
          <div>
            <strong>${m.name}</strong><br>
            <small style="color:#4ade80; font-weight:bold;">₹${m.price}</small>
          </div>
          <button class="btn-delete" onclick="deleteItem(${m.id})">Remove</button>
        </div>
      `).join('');
    }

    // Preview Bill
    function previewCurrentBill() {
      const selected = menu.filter(m => (cart[m.id] || 0) > 0);
      if (!selected.length) {
        alert("Please add at least 1 item first!");
        return;
      }

      let total = 0;
      selected.forEach(m => total += m.price * cart[m.id]);

      activeSlipRecord = {
        token: currentToken,
        date: new Date().toLocaleDateString('en-GB'),
        mode: "Preview",
        total: total
      };

      activeSlipItems = selected.map(m => ({
        name: m.name,
        qty: cart[m.id],
        price: m.price,
        subTotal: m.price * cart[m.id]
      }));

      renderReceiptPreview(activeSlipRecord, activeSlipItems);
      document.getElementById("token-modal
